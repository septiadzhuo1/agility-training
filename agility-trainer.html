<title>Agility Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  /* === Tokens — dark-first, both themes === */
  :root {
    --bg:   #0C0F15;
    --surf: #141820;
    --s2:   #1C2030;
    --brd:  #242B3D;
    --acc:  #4D8FFF;
    --acc2: #2F6FE0;
    --acc-bg: rgba(77, 143, 255, 0.13);
    --txt:  #C8D0E4;
    --txs:  #E6EAF6;
    --dim:  #48546C;
    --ok:   #3EC880;
    --r:    13px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:  #ECEEF6;
      --surf:#FFFFFF;
      --s2:  #F3F5FC;
      --brd: #D8DDED;
      --txt: #3A4060;
      --txs: #181C2E;
      --dim: #8A94B0;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0C0F15; --surf:#141820; --s2:#1C2030; --brd:#242B3D;
    --txt:#C8D0E4; --txs:#E6EAF6; --dim:#48546C;
  }
  :root[data-theme="light"] {
    --bg:#ECEEF6; --surf:#FFFFFF; --s2:#F3F5FC; --brd:#D8DDED;
    --txt:#3A4060; --txs:#181C2E; --dim:#8A94B0;
  }
  :root[data-theme="light"] { --acc-bg: rgba(77, 143, 255, 0.10); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--txt);
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: background .25s, color .25s;
  }

  .scr {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .scr.on { display: flex; }

  /* ===== SETUP ===== */
  #sSetup { padding: 18px; }

  .card {
    background: var(--surf);
    border: 1px solid var(--brd);
    border-radius: var(--r);
    padding: 30px 26px;
    width: 100%; max-width: 390px;
  }

  .eye {
    font-size: 10px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--acc); margin-bottom: 5px;
  }

  h1 {
    font-size: 25px; font-weight: 800;
    color: var(--txs); letter-spacing: -.025em; line-height: 1.1;
  }

  .sub {
    font-size: 12.5px; color: var(--dim);
    margin-top: 4px; margin-bottom: 24px;
  }

  /* Direction toggle grid */
  .dir-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 22px;
  }

  .dt {
    background: var(--s2);
    border: 1.5px solid var(--brd);
    border-radius: 9px;
    padding: 10px 6px 9px;
    cursor: pointer;
    transition: border-color .15s, background .15s, opacity .15s;
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
    user-select: none; -webkit-user-select: none;
    min-height: 62px;
  }

  .dt:hover { border-color: var(--dim); }

  .dt.on {
    border-color: var(--acc);
    background: var(--acc-bg);
  }

  .dt-sym {
    font-size: 22px; line-height: 1;
    color: var(--dim);
    transition: color .15s;
  }

  .dt.on .dt-sym { color: var(--acc); }

  .dt-lbl {
    font-size: 8px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); text-align: center; line-height: 1.35;
    transition: color .15s;
  }

  .dt.on .dt-lbl { color: var(--txt); }

  .dir-note {
    font-size: 11px; color: var(--dim);
    text-align: center; margin: -14px 0 18px;
  }

  /* Field */
  .fld { margin-bottom: 20px; }
  .lbl {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 10px;
  }

  /* Interval slider */
  .srow { display: flex; align-items: center; gap: 14px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; background: var(--brd);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--acc); cursor: pointer;
    box-shadow: 0 0 0 3px var(--bg);
    transition: box-shadow .15s;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px var(--acc);
  }
  .sv {
    font-size: 19px; font-weight: 800; color: var(--txs);
    min-width: 50px; text-align: right;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }

  /* Reps stepper */
  .step {
    display: flex; align-items: stretch;
    background: var(--s2); border: 1px solid var(--brd);
    border-radius: 8px; overflow: hidden; width: fit-content;
  }
  .sb {
    background: none; border: none; color: var(--txt);
    font-size: 20px; font-weight: 300; cursor: pointer;
    padding: 9px 16px; transition: background .12s, color .12s;
    user-select: none; -webkit-user-select: none; line-height: 1;
    min-width: 44px; min-height: 44px;
  }
  .sb:hover { background: var(--brd); color: var(--txs); }

  .si {
    background: none; border: none;
    border-left: 1px solid var(--brd); border-right: 1px solid var(--brd);
    color: var(--txs); font-size: 18px; font-weight: 800;
    text-align: center; width: 60px; outline: none;
    font-variant-numeric: tabular-nums; padding: 9px 4px;
  }
  .si::-webkit-inner-spin-button, .si::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* Start button */
  .btn-go {
    display: block; width: 100%;
    background: var(--acc); border: none; color: #fff;
    font-size: 14px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; padding: 15px;
    border-radius: 8px; cursor: pointer; margin-top: 6px;
    transition: background .15s, transform .1s;
  }
  .btn-go:hover { background: var(--acc2); }
  .btn-go:active { transform: scale(.98); }

  /* ===== COUNTDOWN ===== */
  #sCd { gap: 10px; }

  .cdlbl {
    font-size: 11px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
  }

  #cdN {
    font-size: clamp(80px, 28vmin, 180px);
    font-weight: 900; color: var(--txs);
    letter-spacing: -.04em; line-height: 1;
  }

  @keyframes cbeat {
    from { transform: scale(1.2); opacity: .7; }
    to   { transform: scale(1); opacity: 1; }
  }
  .beat { animation: cbeat .35s cubic-bezier(0.22, 1, 0.36, 1); }

  /* ===== TRAINING ===== */
  #sTrain { position: relative; }

  /* Progress bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 3px; background: var(--brd); z-index: 5;
  }
  #ibar {
    height: 100%; width: 0%;
    background: var(--acc);
    border-radius: 0 2px 2px 0;
  }

  /* Rep counter */
  .rctr {
    position: fixed; top: 14px; right: 18px;
    font-size: 12px; font-weight: 700; color: var(--dim);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    z-index: 5;
  }

  /* Cue */
  .cue {
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    user-select: none; -webkit-user-select: none;
  }

  #sym {
    font-size: clamp(100px, 44vmin, 260px);
    line-height: 1; color: var(--txs);
  }

  #dlbl {
    font-size: clamp(11px, 2.4vmin, 17px);
    font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: var(--dim);
  }

  @keyframes fin {
    0%  { opacity: 0; transform: scale(.72); }
    55% { transform: scale(1.06); }
    100%{ opacity: 1; transform: scale(1); }
  }

  /* Stop button */
  .bstp {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: transparent; border: 1px solid var(--brd);
    color: var(--dim); font-size: 10.5px; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase;
    padding: 9px 22px; border-radius: 100px; cursor: pointer;
    transition: all .15s; white-space: nowrap; z-index: 5;
  }
  .bstp:hover { background: var(--surf); border-color: var(--dim); color: var(--txt); }

  /* ===== COMPLETE ===== */
  #sEnd { padding: 18px; }

  .ck {
    width: 50px; height: 50px;
    background: var(--ok); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; color: #fff; font-size: 22px;
    font-weight: 700;
  }

  .ett {
    font-size: 23px; font-weight: 800;
    color: var(--txs); letter-spacing: -.02em;
    text-align: center; margin-bottom: 5px;
  }

  .esb {
    font-size: 12.5px; color: var(--dim);
    text-align: center; margin-bottom: 24px;
  }

  .stats {
    display: flex; gap: 1px;
    background: var(--brd); border: 1px solid var(--brd);
    border-radius: 8px; overflow: hidden; margin-bottom: 22px;
  }

  .stat {
    flex: 1; background: var(--s2);
    padding: 14px 8px; text-align: center;
  }

  .stv {
    font-size: 20px; font-weight: 800;
    color: var(--txs); font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  .stl {
    font-size: 9.5px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin-top: 3px;
  }

  .btn-ag {
    display: block; width: 100%;
    background: var(--acc); border: none; color: #fff;
    font-size: 14px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; padding: 14px; border-radius: 8px;
    cursor: pointer; transition: background .15s; margin-bottom: 10px;
  }
  .btn-ag:hover { background: var(--acc2); }

  .btn-cf {
    display: block; background: none; border: none;
    color: var(--dim); font-size: 12px; font-weight: 600;
    cursor: pointer; margin: 0 auto;
    text-decoration: underline; text-underline-offset: 3px;
    transition: color .15s;
  }
  .btn-cf:hover { color: var(--txt); }

  /* Focus */
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--acc); outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .beat, #sym, #dlbl { animation: none !important; transition: none !important; }
  }
</style>

<!-- SETUP -->
<div id="sSetup" class="scr on">
  <div class="card">
    <div class="eye">Reaction Training</div>
    <h1>Agility Trainer</h1>
    <p class="sub">Random cue drill</p>

    <div class="fld">
      <label class="lbl">Active Directions</label>
      <div class="dir-grid" id="dirGrid"></div>
      <div class="dir-note" id="dirNote">All 6 directions active</div>
    </div>

    <div class="fld">
      <label class="lbl" for="isl">Interval per cue</label>
      <div class="srow">
        <input type="range" id="isl" min="0.3" max="5" step="0.1" value="1.5">
        <div class="sv" id="ivd">1.5s</div>
      </div>
    </div>

    <div class="fld">
      <label class="lbl">Repetitions</label>
      <div class="step">
        <button class="sb" id="rMi" aria-label="Decrease repetitions">−</button>
        <input type="number" class="si" id="rIn" value="20" min="5" max="200" aria-label="Number of repetitions">
        <button class="sb" id="rPl" aria-label="Increase repetitions">+</button>
      </div>
    </div>

    <button class="btn-go" id="bStart">Start Training</button>
  </div>
</div>

<!-- COUNTDOWN -->
<div id="sCd" class="scr">
  <div class="cdlbl">Get ready</div>
  <div id="cdN">3</div>
</div>

<!-- TRAINING -->
<div id="sTrain" class="scr">
  <div class="topbar"><div id="ibar"></div></div>
  <div class="rctr" id="rctr">0 / 20</div>
  <div class="cue">
    <div id="sym">↑</div>
    <div id="dlbl">FORWARD</div>
  </div>
  <button class="bstp" id="bStop">Stop</button>
</div>

<!-- COMPLETE -->
<div id="sEnd" class="scr">
  <div class="card">
    <div class="ck">✓</div>
    <div class="ett">Session Complete</div>
    <div class="esb">All reps done — great work</div>
    <div class="stats">
      <div class="stat"><div class="stv" id="stR">—</div><div class="stl">Reps</div></div>
      <div class="stat"><div class="stv" id="stT">—</div><div class="stl">Duration</div></div>
      <div class="stat"><div class="stv" id="stP">—</div><div class="stl">Reps/s</div></div>
    </div>
    <button class="btn-ag" id="bAg">Go Again</button>
    <button class="btn-cf" id="bCf">Change settings</button>
  </div>
</div>

<script>
  // 6 directions — grid order: row1 = ↖ ↑ ↗, row2 = ↙ ↓ ↘
  const DIRS = [
    { s: '↖', l: 'FORWARD LEFT',  gridIdx: 0 },
    { s: '↑', l: 'FORWARD',       gridIdx: 1 },
    { s: '↗', l: 'FORWARD RIGHT', gridIdx: 2 },
    { s: '↙', l: 'BACK LEFT',     gridIdx: 3 },
    { s: '↓', l: 'BACK',          gridIdx: 4 },
    { s: '↘', l: 'BACK RIGHT',    gridIdx: 5 },
  ]

  // Which directions are active (all on by default)
  let enabled = new Set([0, 1, 2, 3, 4, 5])

  // Build direction toggle grid
  ;(function() {
    const grid = document.getElementById('dirGrid')
    DIRS.forEach((d, i) => {
      const btn = document.createElement('button')
      btn.className = 'dt on'
      btn.setAttribute('aria-pressed', 'true')
      btn.setAttribute('aria-label', d.l)
      btn.dataset.idx = i
      btn.innerHTML = `<span class="dt-sym">${d.s}</span><span class="dt-lbl">${d.l}</span>`
      btn.addEventListener('click', () => toggleDir(i, btn))
      grid.appendChild(btn)
    })
  })()

  function toggleDir(i, btn) {
    if (enabled.has(i)) {
      if (enabled.size <= 2) return  // keep at least 2
      enabled.delete(i)
      btn.classList.remove('on')
      btn.setAttribute('aria-pressed', 'false')
    } else {
      enabled.add(i)
      btn.classList.add('on')
      btn.setAttribute('aria-pressed', 'true')
    }
    updateDirNote()
  }

  function updateDirNote() {
    const n = enabled.size
    const note = document.getElementById('dirNote')
    note.textContent = n === 6 ? 'All 6 directions active'
      : n === 1 ? '1 direction active'
      : n + ' directions active'
  }

  // Config
  let cfg = { interval: 1.5, reps: 20 }

  const isl = document.getElementById('isl')
  const ivd = document.getElementById('ivd')
  const rIn = document.getElementById('rIn')

  isl.addEventListener('input', () => {
    cfg.interval = +isl.value
    ivd.textContent = cfg.interval.toFixed(1) + 's'
  })
  document.getElementById('rMi').addEventListener('click', () => {
    const v = Math.max(5, +rIn.value - 5)
    rIn.value = v; cfg.reps = v
  })
  document.getElementById('rPl').addEventListener('click', () => {
    const v = Math.min(200, +rIn.value + 5)
    rIn.value = v; cfg.reps = v
  })
  rIn.addEventListener('change', () => {
    const v = Math.max(5, Math.min(200, +rIn.value || 10))
    rIn.value = v; cfg.reps = v
  })

  // Screen switcher
  function show(id) {
    document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'))
    document.getElementById(id).classList.add('on')
  }

  // Wake lock (keep screen on during training)
  let wl = null
  async function wakeOn() {
    try { wl = await navigator.wakeLock.request('screen') } catch {}
  }
  async function wakeOff() {
    try { if (wl) { await wl.release(); wl = null } } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (wl && document.visibilityState === 'visible') wakeOn()
  })

  // Countdown
  document.getElementById('bStart').addEventListener('click', () => {
    cfg.interval = +isl.value
    cfg.reps = Math.max(5, +rIn.value || 20)
    runCountdown()
  })

  function runCountdown() {
    show('sCd')
    const el = document.getElementById('cdN')
    let n = 3
    el.textContent = n
    el.style.color = ''
    pulse(el)

    const iv = setInterval(() => {
      n--
      if (n <= 0) {
        clearInterval(iv)
        el.textContent = 'GO!'
        el.style.color = 'var(--ok)'
        pulse(el)
        setTimeout(startTrain, 550)
      } else {
        el.textContent = n
        pulse(el)
      }
    }, 850)
  }

  function pulse(el) {
    el.classList.remove('beat')
    el.offsetHeight
    el.classList.add('beat')
  }

  // Training
  let tr = { rep: 0, start: 0, tid: null, last: -1 }

  function startTrain() {
    tr.rep = 0; tr.start = Date.now(); tr.last = -1
    show('sTrain')
    wakeOn()
    nextCue()
  }

  function randDir(exclude) {
    let pool = [...enabled].filter(i => i !== exclude)
    if (pool.length === 0) pool = [...enabled]  // fallback if only 1 direction
    return pool[Math.floor(Math.random() * pool.length)]
  }

  function nextCue() {
    if (tr.rep >= cfg.reps) { finish(); return }

    const i = randDir(tr.last)
    tr.last = i; tr.rep++

    const sym = document.getElementById('sym')
    const dlbl = document.getElementById('dlbl')
    sym.textContent  = DIRS[i].s
    dlbl.textContent = DIRS[i].l
    document.getElementById('rctr').textContent = tr.rep + ' / ' + cfg.reps

    // Progress bar — reset then animate
    const bar = document.getElementById('ibar')
    bar.style.transition = 'none'
    bar.style.width = '0%'
    bar.offsetHeight
    bar.style.transition = 'width ' + cfg.interval + 's linear'
    bar.style.width = '100%'

    // Flash cue
    sym.style.animation = 'none'
    dlbl.style.animation = 'none'
    sym.offsetHeight
    sym.style.animation  = 'fin .22s cubic-bezier(0.34, 1.56, 0.64, 1)'
    dlbl.style.animation = 'fin .22s cubic-bezier(0.34, 1.56, 0.64, 1)'

    tr.tid = setTimeout(nextCue, cfg.interval * 1000)
  }

  function finish() {
    wakeOff()
    const elapsed = (Date.now() - tr.start) / 1000
    document.getElementById('stR').textContent = cfg.reps
    document.getElementById('stT').textContent = fmtTime(Math.round(elapsed))
    document.getElementById('stP').textContent = (cfg.reps / elapsed).toFixed(2)
    show('sEnd')
  }

  document.getElementById('bStop').addEventListener('click', () => {
    clearTimeout(tr.tid); wakeOff(); show('sSetup')
  })
  document.getElementById('bAg').addEventListener('click', runCountdown)
  document.getElementById('bCf').addEventListener('click', () => {
    clearTimeout(tr.tid); wakeOff(); show('sSetup')
  })

  function fmtTime(s) {
    const m = Math.floor(s / 60), sec = s % 60
    return m > 0 ? m + 'm ' + sec + 's' : sec + 's'
  }
</script>
